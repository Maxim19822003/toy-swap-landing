<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Обмен игрушками</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('images/bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    .content {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .text-block {
      width: 100%;
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 28px 22px;
    }

    .text-block p {
      font-size: 17px;
      line-height: 1.6;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 90%;
      min-height: 64px;
      padding: 14px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.97);
    }

    .btn-icon {
      font-size: 20px;
      line-height: 1;
    }

    .footer-text {
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .footer-text a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="text-block">
      <p>Хочешь обменять игрушки? Это можно сделать через приложение, группу в ВК или позвонить администратору.</p>
    </div>

    <div class="buttons">
      <a href="https://vk.com/appXXXXXX" class="btn">
        <span class="btn-icon">&#128241;</span>
        <span>Открыть приложение</span>
      </a>
      <a href="https://vk.com/clubXXXXXX" class="btn">
        <span class="btn-icon">&#128172;</span>
        <span>Группа ВК</span>
      </a>
      <a href="tel:+79105489295" class="btn">
        <span class="btn-icon">&#128222;</span>
        <span>Позвонить</span>
      </a>
    </div>

    <p class="footer-text">Этот лэндинг сделал Waronin</a></p>
  </div>
</body>
</html>
